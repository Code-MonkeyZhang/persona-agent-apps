  血小板:
    max_value: 1000
    unit: 10^9/L
    message: "血小板值 1000×10^9/L 以上已超出合理范围，请检查"

  潜血:
    max_value: 500
    unit: Cell/uL
    message: "潜血值 500Cell/uL 以上已超出合理范围，请检查"

  pH值:
    min_value: 4.0
    max_value: 10.0
    unit: ""
    message: "pH值应在 4.0-10.0 范围内，请检查"

# ==========================================
# 必填项规则
# ==========================================

required_fields:
  - date
  - analyte
